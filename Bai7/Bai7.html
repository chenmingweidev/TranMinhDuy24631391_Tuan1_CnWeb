<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="utf-8">
        <title>ONTAP</title>
        <link rel="stylesheet" href="ONTAP.css">
    </head>
    <body>
        <form action="Next.html" method="get" target="_blank">
            <table border="6">
                <thead>
                <tr style="background-color:azure">
                    <td colspan="2"><h1>信息学生</h1></td>
                </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><label for="Uni"><b>选择学教</b></label></td>
                        <td>
                            <select id="Uni">
                                <option>杭州电子科技大学</option>
                                <option>胡志明是工业大学</option>
                                <option>清华大学</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td><i>输入名字</i></td>
                        <td><input type="text" name="name" placeholder="enter your name" required></td>
                    </tr>
                    <tr>
                        <td>电子邮件</td>
                        <td><input type="email" name="email" placeholder="enter your email" required></td>
                    </tr>
                    <tr style="background-color:rgb(185, 232, 208)">
                        <td colspan="2"><h1 style="color:chartreuse; ">手机号</h1></td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <input type="radio" id="INcountry" name="phonenumer">
                            <label for="INcountry">
                                +84 
                                <input type="tel" name="phonenumber" placeholder="enter your phone number" required pattern="[0-9]{10}" maxlength="10">
                            </label>
                            <input type="radio" id="OUTcountry" name="phonenumer">
                             <label for="INcountry">
                                其他
                                <select name="countryCode">
                                    <option value="+1">+1</option>
                                    <option value="+12">+12</option>
                                    <option value="custom">输入</option>
                                </select>
                                    <input
                                        type="text"
                                        id="customCode"
                                        placeholder="Your country code"
                                        name="countryCode"
                                        maxlength="3"
                                        pattern="\+[0-9]{1,3}"
                                    >

                                    <input
                                        type="tel"
                                        name="phonenumber"
                                        placeholder="Enter your phone number"
                                        required
                                        pattern="[0-9]{10}"
                                        maxlength="10"
                                        disabled>
                                </select>
                             </label>
                        </td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr>
                        <td colspan="2">
                            <input type="reset" value="reset">
                            <input type="submit" value="submit">
                        </td>
                    </tr>
                </tfoot>
            </table>
        </form>
